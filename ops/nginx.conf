limit_req_zone $binary_remote_addr zone=tutor_auth:1m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name tutor.baibakovkir.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tutor-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tutor.baibakovkir.space;
    ssl_certificate /etc/letsencrypt/live/tutor.baibakovkir.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutor.baibakovkir.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/api/(auth/callback/credentials|portal/access) {
        limit_req zone=tutor_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:13003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
